<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title></title>
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="app-header">
  <div class="header-main">
    <p class="eyebrow" id="app-eyebrow"></p>
    <h1 class="root-title-wrap"><button type="button" id="root-title" class="root-title"></button></h1>
    <div class="chips" id="header-chips"></div>
  </div>
  <div class="header-actions">
    <button type="button" id="submit-round" class="button"></button>
    <button type="button" id="export-story" class="button button-primary"></button>
  </div>
</header>

<div id="status-line" class="status-line" role="status" aria-live="polite"></div>

<nav class="tabbar" id="tabbar">
  <button type="button" data-tab="outline" id="tab-outline"></button>
  <button type="button" data-tab="story" id="tab-story"></button>
  <button type="button" data-tab="editor" id="tab-editor"></button>
</nav>

<div class="app-body" id="app-body" data-tab="story" data-toc-open="false">
  <aside class="panel toc-panel" id="toc-panel">
    <div class="panel-head">
      <h2 id="toc-heading"></h2>
      <div class="panel-head-actions">
        <button type="button" id="expand-all" class="button button-small"></button>
        <button type="button" id="collapse-all" class="button button-small"></button>
      </div>
    </div>
    <nav class="toc" id="toc-nav"></nav>
  </aside>

  <main class="panel canvas" id="canvas">
    <div class="canvas-toolbar">
      <div class="view-switch" id="view-switch" role="group">
        <button type="button" id="view-outline" class="segment"></button>
        <button type="button" id="view-full" class="segment"></button>
      </div>
      <button type="button" id="toc-toggle" class="button button-small"></button>
    </div>
    <div class="workflow-zone" id="workflow-zone" hidden></div>
    <div class="story-body" id="story-body"></div>
  </main>

  <aside class="panel inspector" id="inspector">
    <div class="inspector-head" id="inspector-head"></div>
    <div class="conflict-banner" id="conflict-banner" hidden></div>
    <div id="node-editor"></div>
    <div class="save-bar" id="save-bar"></div>
  </aside>
</div>

<dialog id="confirm-dialog" class="dialog">
  <p id="confirm-message"></p>
  <div class="dialog-actions" id="confirm-actions"></div>
</dialog>

<script type="module" src="/app.js"></script>
</body>
</html>
