<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <title>omp-enhancer marketplace plugin system architecture</title>
  <desc>System architecture of the omp-enhancer marketplace plugin system. The OMP Host harness at the top manages sessions, tools, and permissions. Six marketplace plugins in the middle layer register tools through omp.registerTool(). Solid borders and connectors mark tools that are active by default, namely the tikz-helper tools. Dashed borders and connectors mark defaultInactive tools that require the /enhancer-tools enable command. At the bottom, the tikz-helper ELK pipeline flows from an ELK graph IR through tikz_generate_diagram to TikZ source, then through tikz_render to PDF, SVG, or PNG output.</desc>

  <text id="label-diagram-title" x="32" y="56" font-size="20" font-weight="bold" fill="#000">omp-enhancer Marketplace Plugin Architecture</text>

  <rect id="node-omp-host" x="32" y="76" width="1216" height="96" fill="#fff" stroke="#000" stroke-width="2"/>
  <text id="label-host-title" x="640" y="112" font-size="20" font-weight="bold" fill="#000" text-anchor="middle">OMP Host</text>
  <text id="label-host-subtitle" x="640" y="144" font-size="16" fill="#000" text-anchor="middle">manages sessions, tools, permissions</text>

  <line id="edge-register-tool" x1="640" y1="230" x2="640" y2="184" stroke="#000" stroke-width="2"/>
  <polygon id="arrow-register-tool" points="634,184 646,184 640,172" fill="#000"/>
  <text id="label-register-tool" x="620" y="205" font-size="16" fill="#000" text-anchor="end">omp.registerTool()</text>

  <line id="edge-enable-tools" x1="736" y1="172" x2="736" y2="218" stroke="#000" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon id="arrow-enable-tools" points="730,218 742,218 736,230" fill="#000"/>
  <text id="label-enable-tools" x="756" y="205" font-size="16" fill="#000" text-anchor="start">/enhancer-tools enable</text>

  <rect id="node-plugin-layer" x="32" y="230" width="1216" height="190" fill="#fff" stroke="#000" stroke-width="2"/>
  <text id="label-plugin-layer" x="56" y="258" font-size="16" font-weight="bold" fill="#000">Marketplace plugin layer</text>

  <rect id="node-plugin-core" x="56" y="284" width="176" height="96" fill="#fff" stroke="#000" stroke-width="2" stroke-dasharray="6 4"/>
  <text id="label-plugin-core-name" x="144" y="320" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">omp-enhancer-core</text>
  <text id="label-plugin-core-state" x="144" y="352" font-size="16" fill="#000" text-anchor="middle">defaultInactive</text>

  <rect id="node-plugin-config" x="254" y="284" width="176" height="96" fill="#fff" stroke="#000" stroke-width="2" stroke-dasharray="6 4"/>
  <text id="label-plugin-config-name" x="342" y="320" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">omp-config</text>
  <text id="label-plugin-config-state" x="342" y="352" font-size="16" fill="#000" text-anchor="middle">defaultInactive</text>

  <rect id="node-plugin-writing" x="452" y="284" width="176" height="96" fill="#fff" stroke="#000" stroke-width="2" stroke-dasharray="6 4"/>
  <text id="label-plugin-writing-name" x="540" y="320" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">writing-helper</text>
  <text id="label-plugin-writing-state" x="540" y="352" font-size="16" fill="#000" text-anchor="middle">defaultInactive</text>

  <rect id="node-plugin-test" x="650" y="284" width="176" height="96" fill="#fff" stroke="#000" stroke-width="2" stroke-dasharray="6 4"/>
  <text id="label-plugin-test-name" x="738" y="320" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">omp-test-enhancer</text>
  <text id="label-plugin-test-state" x="738" y="352" font-size="16" fill="#000" text-anchor="middle">defaultInactive</text>

  <rect id="node-plugin-factcheck" x="848" y="284" width="176" height="96" fill="#fff" stroke="#000" stroke-width="2" stroke-dasharray="6 4"/>
  <text id="label-plugin-factcheck-name" x="936" y="320" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">omp-fact-checker</text>
  <text id="label-plugin-factcheck-state" x="936" y="352" font-size="16" fill="#000" text-anchor="middle">defaultInactive</text>

  <rect id="node-plugin-tikz" x="1046" y="284" width="176" height="96" fill="#fff" stroke="#000" stroke-width="2"/>
  <text id="label-plugin-tikz-name" x="1134" y="320" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">tikz-helper</text>
  <text id="label-plugin-tikz-state" x="1134" y="352" font-size="16" fill="#000" text-anchor="middle">active by default</text>

  <polyline id="edge-tikz-pipeline" points="1134,380 1134,444 380,444 380,500" fill="none" stroke="#000" stroke-width="2"/>
  <polygon id="arrow-tikz-pipeline" points="374,500 386,500 380,512" fill="#000"/>

  <text id="label-pipeline-title" x="56" y="488" font-size="16" font-weight="bold" fill="#000">ELK to render pipeline</text>

  <rect id="node-pipeline-elk-ir" x="56" y="512" width="150" height="56" fill="#fff" stroke="#000" stroke-width="2"/>
  <text id="label-pipeline-elk-ir" x="131" y="546" font-size="16" fill="#000" text-anchor="middle">ELK graph IR</text>

  <line id="edge-pipeline-1" x1="206" y1="540" x2="258" y2="540" stroke="#000" stroke-width="2"/>
  <polygon id="arrow-pipeline-1" points="258,534 258,546 270,540" fill="#000"/>

  <rect id="node-pipeline-generate" x="270" y="512" width="220" height="56" fill="#fff" stroke="#000" stroke-width="2"/>
  <text id="label-pipeline-generate" x="380" y="546" font-size="16" fill="#000" text-anchor="middle">tikz_generate_diagram</text>

  <line id="edge-pipeline-2" x1="490" y1="540" x2="542" y2="540" stroke="#000" stroke-width="2"/>
  <polygon id="arrow-pipeline-2" points="542,534 542,546 554,540" fill="#000"/>

  <rect id="node-pipeline-tikz-src" x="554" y="512" width="150" height="56" fill="#fff" stroke="#000" stroke-width="2"/>
  <text id="label-pipeline-tikz-src" x="629" y="546" font-size="16" fill="#000" text-anchor="middle">TikZ source</text>

  <line id="edge-pipeline-3" x1="704" y1="540" x2="756" y2="540" stroke="#000" stroke-width="2"/>
  <polygon id="arrow-pipeline-3" points="756,534 756,546 768,540" fill="#000"/>

  <rect id="node-pipeline-render" x="768" y="512" width="150" height="56" fill="#fff" stroke="#000" stroke-width="2"/>
  <text id="label-pipeline-render" x="843" y="546" font-size="16" fill="#000" text-anchor="middle">tikz_render</text>

  <line id="edge-pipeline-4" x1="918" y1="540" x2="970" y2="540" stroke="#000" stroke-width="2"/>
  <polygon id="arrow-pipeline-4" points="970,534 970,546 982,540" fill="#000"/>

  <rect id="node-pipeline-output" x="982" y="512" width="190" height="56" fill="#fff" stroke="#000" stroke-width="2"/>
  <text id="label-pipeline-output" x="1077" y="546" font-size="16" fill="#000" text-anchor="middle">PDF / SVG / PNG</text>

  <rect id="node-legend" x="32" y="600" width="640" height="84" fill="#fff" stroke="#000" stroke-width="2"/>
  <line id="edge-legend-solid" x1="56" y1="628" x2="112" y2="628" stroke="#000" stroke-width="2"/>
  <text id="label-legend-solid" x="128" y="634" font-size="16" fill="#000">solid = active by default (tikz-helper tools)</text>
  <line id="edge-legend-dashed" x1="56" y1="662" x2="112" y2="662" stroke="#000" stroke-width="2" stroke-dasharray="6 4"/>
  <text id="label-legend-dashed" x="128" y="668" font-size="16" fill="#000">dashed = defaultInactive until /enhancer-tools enable</text>
</svg>
